[package]
name = "cofferak-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "cofferak admin CLI: vault setup, host and service enrollment, secrets, DEK rotation, recovery and audit"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "cofferak"
path = "src/main.rs"

[dependencies]
cofferak-core = { path = "../cofferak-core" }
# `cofferakd` now has a library target (see `cofferakd/src/lib.rs`), so
# `audit.rs`'s `run_audit_tail` depends on `cofferakd::audit::{AuditLog,
# AuditEntry}` directly rather than pulling the source in via `#[path]`.
cofferakd = { path = "../cofferakd" }
clap = { version = "4", features = ["derive", "env"] }
rand_core = { version = "0.6", features = ["getrandom"] }
bincode = "1"
zeroize = "1"
libc = "0.2"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
block2 = "0.6"
