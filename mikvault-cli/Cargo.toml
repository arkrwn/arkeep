[package]
name = "mikvault-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "mikvault command-line interface"

[dependencies]
mikvault-core = { path = "../mikvault-core" }
# `mikvaultd` now has a library target (see `mikvaultd/src/lib.rs`), so
# `audit.rs`'s `run_audit_tail` depends on `mikvaultd::audit::{AuditLog,
# AuditEntry}` directly rather than pulling the source in via `#[path]`.
mikvaultd = { path = "../mikvaultd" }
clap = { version = "4", features = ["derive", "env"] }
rand_core = { version = "0.6", features = ["getrandom"] }
bincode = "1"
# `src/client.rs` still pulls in its own copy of `mikvaultd/src/protocol.rs`
# via `#[path]` rather than `mikvaultd::protocol` (pre-existing convention,
# left as-is by Task 15); these back that `serde`/`serde_json`-based copy.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
