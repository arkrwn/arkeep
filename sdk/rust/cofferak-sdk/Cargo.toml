[package]
name = "cofferak-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust client SDK for cofferak (connects to cofferakd over its Unix socket)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Server mode (ADR 0008): optional TLS/TCP transport alongside the Unix
# socket. Pure-Rust TLS, no OpenSSL/C dependency.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
