[package]
name = "arkeep-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust client SDK for arkeep (connects to arkeepd over its Unix socket)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Server mode (ADR 0008): optional TLS/TCP transport alongside the Unix
# socket. Pure-Rust TLS, no OpenSSL/C dependency. No `tls12` feature —
# see arkeepd/Cargo.toml's comment: both ends are our own code, so
# TLS 1.3-only is the strictly safer default, not a compatibility risk.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
