[project]
name = "cofferak-sdk"
version = "0.1.0"
description = "Python client SDK for cofferak (Unix socket and TLS 1.3 / mTLS)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.urls]
Homepage = "https://github.com/arkrwn/cofferak"
Repository = "https://github.com/arkrwn/cofferak"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
