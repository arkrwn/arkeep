[package]
name = "mikavtd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "mikavt daemon"

[dependencies]
mikavt-core = { path = "../mikavt-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
# Server mode (ADR 0008): TLS-wrapped TCP as an additional transport
# alongside the Unix socket. Pure-Rust TLS, no OpenSSL/C dependency.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
