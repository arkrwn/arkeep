[package]
name = "mikavtd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "mikavt daemon"

[dependencies]
mikavt-core = { path = "../mikavt-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
# Server mode (ADR 0008): TLS-wrapped TCP as an additional transport
# alongside the Unix socket. Pure-Rust TLS, no OpenSSL/C dependency.
# Deliberately NOT enabling the `tls12` feature: both ends of this
# protocol are mikavt's own code (the daemon and its own SDKs), so
# there's no legacy-client compatibility reason to allow TLS 1.2 —
# TLS 1.3-only is strictly the safer default here.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
